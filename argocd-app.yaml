apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: asthropic-backend-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/SajalBharadwaj/asthropic-chatapp.git'
    targetRevision: HEAD
    path: k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: asthropic-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
