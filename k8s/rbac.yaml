apiVersion: v1
kind: ServiceAccount
metadata:
  name: asthropic-sa
  namespace: asthropic-prod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: asthropic-prod
  name: asthropic-role
rules:
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: asthropic-rolebinding
  namespace: asthropic-prod
subjects:
- kind: ServiceAccount
  name: asthropic-sa
  namespace: asthropic-prod
roleRef:
  kind: Role
  name: asthropic-role
  apiGroup: rbac.authorization.k8s.io
