apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: asthropic-network-policy
  namespace: asthropic-prod
spec:
  podSelector:
    matchLabels:
      app: asthropic-backend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 5000
  egress:
  - to: []
